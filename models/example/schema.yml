#sources.yml → Defines your existing Snowflake source table, RAW_ORDERS.
#schema.yml → Defines tests and documentation for your dbt models, such as stg_orders and fct_orders.
version: 2

models:
    - name: my_first_dbt_model
      description: "A starter dbt model"
      columns:
          - name: id
            description: "The primary key for this table"
            tests:
                - unique
                - not_null

    - name: my_second_dbt_model
      description: "A starter dbt model"
      columns:
          - name: id
            description: "The primary key for this table"
            tests:
                - unique
                - not_null
    - name: fct_orders
      description: "Testing Model"
      columns:
        - name: customer_id
          tests: 
              - unique
              - not_null
        - name: completed_order_count
          tests:
            - not_null
        - name: total_completed_amount
          tests:
            - not_null

    - name: stg_orders
      columns:
        - name: order_id
          tests:
            - unique
            - not_null
        - name: customer_id
          tests:
            - not_null
        - name: order_amount
          tests:
            - not_null
        - name : order_status
          tests:
            - not_null
            
            
            
              
              
